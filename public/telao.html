<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sipah · Telão</title>
<meta name="theme-color" content="#0d0a1a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<style>
/* Layout: placar à esquerda, "raio-x do estande" no meio, QR code e últimas corridas à direita */
:root{
  --ink:#0d0a1a; --glow:#2c1766; --panel:#1c153a; --panel2:#251c4c; --line:#3b2f70;
  --fg:#fbfaff; --muted:#b9b0de; --lime:#c8f31d; --rosa:#ff3ea5; --shadow:#07050f;
  --brand:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
  --display:"Lilita One","Arial Rounded MT Bold","Rubik",system-ui,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --u:min(1vw,1.78vh);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(110% 80% at 30% 0%,var(--glow) 0%,var(--ink) 60%);background-color:var(--ink);color:var(--fg);font-family:var(--body);
  font-size:max(15px,calc(var(--u)*1.25));line-height:1.3;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(14px,calc(var(--u)*2)) max(14px,calc(var(--u)*2))}
.app{min-height:calc(100vh - max(28px,calc(var(--u)*4)));display:grid;grid-template-rows:auto 1fr;gap:max(14px,calc(var(--u)*2))}
header{display:flex;align-items:center;gap:max(14px,calc(var(--u)*2.4));flex-wrap:wrap}
.logo{font-family:var(--brand);font-size:max(44px,calc(var(--u)*6));line-height:1;transform:rotate(-5deg);
  text-shadow:.06em .06em 0 var(--lime),-.035em -.035em 0 var(--shadow),.035em -.035em 0 var(--shadow),-.035em .035em 0 var(--shadow),.09em .1em 0 var(--shadow)}
.live{display:inline-flex;align-items:center;gap:.5em;background:var(--rosa);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:.8em;padding:.4em .8em;border-radius:.5em}
.live i{width:.7em;height:.7em;border-radius:50%;background:var(--fg);animation:pulse 1.2s infinite}
.live.off{background:var(--panel2);color:var(--muted)} .live.off i{animation:none;background:var(--muted)}
@keyframes pulse{50%{opacity:.25}}
.stats{margin-left:auto;display:flex;gap:max(18px,calc(var(--u)*3))}
.stat b{display:block;font-family:var(--display);font-size:2.2em;line-height:1;color:var(--lime);font-variant-numeric:tabular-nums}
.stat span{font-size:.75em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
main{display:grid;grid-template-columns:1.25fr 1fr .9fr;gap:max(14px,calc(var(--u)*2));min-height:0}
section{background:var(--panel);border:2px solid var(--line);border-radius:max(18px,calc(var(--u)*2));padding:max(16px,calc(var(--u)*2));display:flex;flex-direction:column;gap:max(10px,calc(var(--u)*1.2));min-width:0;min-height:0}
h2{margin:0;font-family:var(--display);font-size:1.7em;line-height:1.1;text-wrap:balance}
.eyebrow{font-weight:800;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:max(6px,calc(var(--u)*.7))}
.rk li{display:grid;grid-template-columns:2.4em 1fr auto;align-items:center;gap:.8em;background:var(--panel2);border-radius:.7em;padding:.55em .8em;border-left:.35em solid var(--c,var(--line))}
.rk li:first-child{background:var(--glow);font-size:1.18em}
.rk .pos{font-family:var(--display);font-size:1.4em;color:var(--lime);text-align:center}
.rk .n{min-width:0}
.rk .n b{display:block;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .n span{font-size:.75em;color:var(--muted)}
.rk .s{font-family:var(--display);font-size:1.5em;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:1.05em;padding:1em 0}
.arch{display:flex;flex-direction:column;gap:max(8px,calc(var(--u)*1))}
.arow{display:grid;grid-template-columns:minmax(0,11em) 1fr 2.2em;align-items:center;gap:.7em;font-weight:600;font-size:.92em}
.arow .t{height:1em;background:var(--panel2);border-radius:99px;overflow:hidden}
.arow .t i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.arow b{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.arow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader{margin-top:auto;border:2px dashed var(--lime);border-radius:.9em;padding:.8em 1em;display:flex;flex-direction:column;gap:.15em}
.leader strong{font-size:1.35em;font-weight:900}
.qr{display:flex;flex-direction:column;align-items:center;gap:.6em;text-align:center}
.qrbox{width:min(100%,calc(var(--u)*22));min-width:150px;aspect-ratio:1;background:#fff;border-radius:.6em;padding:.4em;max-width:100%}
.qrbox svg{display:block;width:100%;height:100%}
.qr p{margin:0;font-family:var(--display);font-size:1.25em;text-wrap:balance}
.url{font-size:.8em;color:var(--muted);word-break:break-all;user-select:all}
.feed li{display:flex;justify-content:space-between;gap:.6em;font-size:.9em;padding:.35em 0;border-bottom:1px solid var(--line)}
.feed li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed li b{font-variant-numeric:tabular-nums;color:var(--lime)}
.feed li.new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:rgba(200,243,29,.35)}to{background:transparent}}
.toast{position:fixed;left:50%;bottom:max(20px,calc(var(--u)*4));transform:translateX(-50%) rotate(-2deg);background:var(--lime);color:var(--ink);
  font-family:var(--display);font-size:max(22px,calc(var(--u)*3));padding:.4em 1em;border-radius:.4em;box-shadow:.12em .12em 0 var(--shadow);
  max-width:calc(100% - 32px);text-align:center;animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:translateX(-50%) scale(.4) rotate(-8deg);opacity:0}}
@media (max-width:1100px){main{grid-template-columns:1fr 1fr}.side{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:1.5em;align-items:start}}
@media (max-width:700px){main{grid-template-columns:1fr}.side{display:flex}.stats{margin-left:0;width:100%;justify-content:space-between}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Sipah</div>
    <span class="live off" id="live"><i></i><span id="live-t">Conectando…</span></span>
    <div class="stats">
      <div class="stat"><b id="st-players">0</b><span>Jogadores hoje</span></div>
      <div class="stat"><b id="st-runs">0</b><span>Corridas</span></div>
    </div>
  </header>
  <main>
    <section>
      <span class="eyebrow">Ranking de hoje</span>
      <h2>Quem corre mais dos boletos</h2>
      <ol class="rk" id="rank"></ol>
    </section>
    <section>
      <span class="eyebrow">Raio-x do estande</span>
      <h2>Que tipo de problema apareceu hoje</h2>
      <div class="arch" id="arch"></div>
      <div class="leader" id="leader" hidden>
        <span class="eyebrow">Perfil mais comum, e a área do SENAI que combina</span>
        <strong id="leader-n"></strong>
        <span id="leader-a"></span>
      </div>
    </section>
    <section class="side">
      <div class="qr">
        <div class="qrbox" id="qr" role="img" aria-label="QR code para abrir o Sipah no celular"></div>
        <p>Aponta a câmera e descubra que tipo de problema você é</p>
        <span class="url" id="url"></span>
      </div>
      <div>
        <span class="eyebrow">Últimas corridas</span>
        <ol class="feed" id="feed"></ol>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/net.js"></script>
<script src="js/telao.js"></script>
</body>
</html>
